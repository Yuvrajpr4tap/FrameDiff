[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framediff"
version = "0.2.0"
description = "Schema-aware, zero-config dataframe diffing and change-tracking library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "framediff contributors"}
]
keywords = ["dataframe", "diff", "schema", "pandas", "polars", "change-tracking", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
polars = ["polars>=0.19.0"]
rich = ["rich>=10.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.990",
]
all = [
    "framediff[polars,rich,dev]",
]

[project.urls]
Homepage = "https://github.com/framediff/framediff"
Documentation = "https://github.com/framediff/framediff#readme"
Repository = "https://github.com/framediff/framediff.git"
"Bug Tracker" = "https://github.com/framediff/framediff/issues"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=framediff --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
source = ["framediff"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
